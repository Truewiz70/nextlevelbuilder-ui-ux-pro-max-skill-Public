# CI for the AI Receptionist platform.
# NOTE: this workflow activates when the ai-receptionist/ folder becomes the
# root of its dedicated repository (GitHub only reads .github/ at repo root).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: receptionist
          POSTGRES_PASSWORD: receptionist
          POSTGRES_DB: receptionist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U receptionist"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://receptionist:receptionist@localhost:5432/receptionist
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e "apps/api[dev]" "psycopg2-binary"
      - name: Lint
        run: |
          ruff check apps/api
          ruff format --check apps/api
      - name: Migrate
        working-directory: apps/api
        run: alembic upgrade head
      - name: Test
        working-directory: apps/api
        run: pytest -q
